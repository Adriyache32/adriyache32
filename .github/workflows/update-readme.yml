name: Update Profile README

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-readme.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update stats placeholders
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          COMMIT=$(git log -1 --format="%h %s" --date=short)
          sed -i "s/Última actualización: .*/Última actualización: $DATE/" README.md
          sed -i "s/Último commit: .*/Último commit: $COMMIT/" README.md
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update profile README [skip ci]"
          git push
